<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pola figur — prostokąt i trójkąt</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>
    <main>
        <nav>
            <h3>MENU</h3>
            <ul>
                <li><a href="index.html">Prostokąt i trójkąt</a></li>
                <li><a href="kolo.html">Okrąg i koło</a></li>
            </ul>
        </nav>

        <div>
            <!-- Moduł 01: [SEC-3] Stan początkowy — trójkąt (1d.bmp), zanim wykona się Skrypt 1 -->
            <img src="1d.bmp" alt="Figura" id="duzyObraz">
            <br>
            <!-- Moduł 01: [SEC-1] onclick — miniatura 1m.bmp ustawia duży obraz na 1d.bmp -->
            <img src="1m.bmp" alt="Wybierz trójkąt" class="wybierz" onclick="wybierzTrojkat()">
            <!-- Moduł 01: [SEC-2] onclick — miniatura 2m.bmp ustawia duży obraz na 2d.bmp -->
            <img src="2m.bmp" alt="Wybierz prostokąt" class="wybierz" onclick="wybierzProstokat()">
        </div>

        <aside>
            <h3>Pole prostokąta / pole trójkąta</h3>
            <label for="a">Bok prostokąta / podstawa trójkąta:</label><br>
            <input type="number" id="a" min="0"><br>
            <label for="b">Drugi bok prostokąta / wysokość trójkąta:</label><br>
            <input type="number" id="b" min="0">
            <!-- Moduł 02: onclick — obliczPole() po kliknięciu przycisku -->
            <button type="button" onclick="obliczPole()">Oblicz</button>
            <!-- Moduł 02: [SEC-3] Paragraf pod przyciskiem na wynik -->
            <p id="wynik"></p>
        </aside>
    </main>

    <footer>
        <p>Autor: 00000000000</p>
    </footer>

    <script src="skrypt.js"></script>
</body>
</html>
